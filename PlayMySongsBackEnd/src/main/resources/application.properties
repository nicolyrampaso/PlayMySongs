spring.application.name=PlayMySongsBackEnd
# URI do MongoDB Atlas vem da variavel de ambiente MONGODB_URI (sem senha no codigo);
# se ela nao existir, usa o MongoDB local
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=play_my_songs
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
