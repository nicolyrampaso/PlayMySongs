<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMySongs - Buscar músicas</title>
    <link href="css/estilos.css" rel="stylesheet" type="text/css"/>
    <script src="js/fetchfunctions.js" type="text/javascript"></script>
    <script src="js/busca.js" type="text/javascript"></script>
</head>
<body>
    <header>
        <a href="index.html"><img src="img/logo.png" alt="PlayMySongs"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="envio.html">Enviar música</a>
            <a href="busca.html">Buscar músicas</a>
        </nav>
    </header>

    <main>
        <h2>Buscar músicas</h2>
        <div class="cartao">
            <form id="fbusca" class="linha" onsubmit="buscarMusicas(event)">
                <label>Chave de busca
                    <input type="text" id="chave" name="chave" placeholder="Parte do nome, estilo ou artista">
                </label>
                <button type="submit">Buscar</button>
            </form>
        </div>
        <p id="total" class="rotulo"></p>
        <div id="resultado" class="lista"></div>
    </main>

    <footer>PlayMySongs — Música sem fronteiras</footer>

    <div id="mensagem"></div>
</body>
</html>
